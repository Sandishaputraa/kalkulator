name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Mesin Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Mesin Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instal Framework Cordova
        run: npm install -g cordova

      - name: Proses Build APK
        run: |
          cordova create app com.byputra.kalkulator Kalkulator
          rm -rf app/www/*
          cp index.html app/www/
          cp 45520.png app/icon.png
          cd app
          cat <<ConfigXML > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.byputra.kalkulator" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Kalkulator</name>
              <description>Kalkulator Web to APK by Putra</description>
              <author email="dev@byputra.com" href="http://byputra.com">Putra</author>
              <content src="index.html" />
              <icon src="icon.png" />
              <preference name="Orientation" value="portrait" />
          </widget>
          ConfigXML
          cordova platform add android
          cordova build android
          
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Kalkulator-v1.0.apk

      - name: Unggah ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: Kalkulator-v1.0.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Kalkulator App v1.0.${{ github.run_number }}"
          body: "Aplikasi Kalkulator Android otomatis versi terbaru buatan Putra."

