<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Final</title>
    <style>
        /* Mencegah efek kilat biru & teks ter-highlight */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* Latar belakang hitam polos */
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }

        .kalkulator {
            width: max-content; 
            padding: 30px 20px;
            background: transparent;
        }

        .layar {
            color: #ffffff;
            font-size: 5rem; /* Ukuran dasar */
            font-weight: 300;
            text-align: right;
            padding: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            white-space: nowrap;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            /* Transisi mulus saat font mengecil/membesar */
            transition: font-size 0.15s ease-in-out; 
        }

        .tombol-grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 15px;
        }

        /* EFEK KACA DAN GLOW TOMBOL */
        button {
            border: none;
            outline: none;
            border-radius: 50%;
            height: 70px;
            width: 70px;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-angka { 
            background: rgba(255, 255, 255, 0.15); 
            color: white; 
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        }
        .btn-angka:active { 
            background: rgba(255, 255, 255, 0.3); 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .btn-aksi { 
            background: rgba(165, 165, 165, 0.25); 
            color: white; 
            font-size: 1.8rem; 
            box-shadow: 0 0 12px rgba(165, 165, 165, 0.15);
        }
        .btn-aksi:active { 
            background: rgba(165, 165, 165, 0.4); 
            box-shadow: 0 0 20px rgba(165, 165, 165, 0.4);
        }

        .btn-operator { 
            background: rgba(255, 159, 10, 0.75); 
            color: white; 
            font-size: 2.5rem; 
            box-shadow: 0 0 15px rgba(255, 159, 10, 0.4);
        }
        .btn-operator:active { 
            background: rgba(255, 159, 10, 1); 
            box-shadow: 0 0 25px rgba(255, 159, 10, 0.8);
        }

        .nol {
            grid-column: span 2;
            width: 100%;
            border-radius: 35px;
            justify-content: flex-start;
            padding-left: 25px;
        }
    </style>
</head>
<body>

    <div class="kalkulator">
        <div class="layar" id="layar">0</div>
        
        <div class="tombol-grid">
            <button class="btn-aksi" onclick="hapusLayar()">AC</button>
            <button class="btn-aksi" onclick="plusMinus()">+/-</button>
            <button class="btn-aksi" onclick="persen()">%</button>
            <button class="btn-operator" onclick="ketik('/')">÷</button>

            <button class="btn-angka" onclick="ketik('7')">7</button>
            <button class="btn-angka" onclick="ketik('8')">8</button>
            <button class="btn-angka" onclick="ketik('9')">9</button>
            <button class="btn-operator" onclick="ketik('*')">×</button>

            <button class="btn-angka" onclick="ketik('4')">4</button>
            <button class="btn-angka" onclick="ketik('5')">5</button>
            <button class="btn-angka" onclick="ketik('6')">6</button>
            <button class="btn-operator" onclick="ketik('-')">−</button>

            <button class="btn-angka" onclick="ketik('1')">1</button>
            <button class="btn-angka" onclick="ketik('2')">2</button>
            <button class="btn-angka" onclick="ketik('3')">3</button>
            <button class="btn-operator" onclick="ketik('+')">+</button>

            <button class="btn-angka nol" onclick="ketik('0')">0</button>
            <button class="btn-angka" onclick="ketik('.')">.</button>
            <button class="btn-operator" onclick="hitung()">=</button>
        </div>
    </div>

    <script>
        let layar = document.getElementById('layar');
        let nilaiSaatIni = '0';

        function updateLayar() {
            let teksFormat = nilaiSaatIni.replace(/\*/g, '×').replace(/\//g, '÷');
            layar.innerText = teksFormat;

            // Logika auto-resize ukuran angka
            let panjang = teksFormat.length;
            if (panjang > 13) {
                layar.style.fontSize = '2.2rem';
            } else if (panjang > 9) {
                layar.style.fontSize = '3rem';
            } else if (panjang > 6) {
                layar.style.fontSize = '4rem';
            } else {
                layar.style.fontSize = '5rem';
            }
        }

        function ketik(karakter) {
            if (nilaiSaatIni === '0' && karakter !== '.') { nilaiSaatIni = ''; }
            nilaiSaatIni += karakter;
            updateLayar();
        }
        function hapusLayar() { nilaiSaatIni = '0'; updateLayar(); }
        function plusMinus() {
            if (nilaiSaatIni !== '0') {
                if (nilaiSaatIni.startsWith('-')) { nilaiSaatIni = nilaiSaatIni.substring(1); } 
                else { nilaiSaatIni = '-' + nilaiSaatIni; }
                updateLayar();
            }
        }
        function persen() {
            try { nilaiSaatIni = (eval(nilaiSaatIni) / 100).toString(); updateLayar(); } 
            catch { layar.innerText = 'Error'; nilaiSaatIni = '0'; }
        }
        function hitung() {
            try { nilaiSaatIni = eval(nilaiSaatIni).toString(); updateLayar(); } 
            catch { layar.innerText = 'Error'; nilaiSaatIni = '0'; }
        }
    </script>
</body>
</html>
