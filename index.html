<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <style>
        /* Mencegah efek kilat biru & teks ter-highlight, serta mengatur cursor default */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
            cursor: default;
        }

        /* Latar belakang hitam pekat */
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Kontainer Utama Kalkulator */
        .kalkulator {
            width: 340px; 
            padding: 22px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        /* Area Layar */
        .layar-container {
            padding: 10px 15px;
            margin-bottom: 15px;
            height: 125px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: text;
        }

        /* Formula / Riwayat */
        .formula {
            color: #7b7b82;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 4px;
            height: 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Layar Utama Angka dengan Auto-Resize Halus */
        .layar {
            color: #ffffff;
            font-size: 4.2rem;
            font-weight: 300;
            height: 75px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.25);
            transition: font-size 0.08s ease-out;
        }

        /* Grid Tombol Presisi */
        .tombol-grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 12px;
            justify-content: center;
        }

        /* Tombol dengan Smooth Click, Advanced Texture, dan Cursor Pointer */
        button {
            border: none;
            outline: none;
            border-radius: 50%;
            height: 70px;
            width: 70px;
            font-size: 1.9rem;
            /* Mengubah cursor menjadi pointer interaktif */
            cursor: pointer; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.06s cubic-bezier(0.4, 0, 0.2, 1), filter 0.15s ease, background 0.15s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
        }

        /* Sensasi klik yang lebih responsif dan empuk */
        button:active {
            transform: scale(0.90);
            filter: brightness(1.25);
        }

        .btn-angka { 
            background: linear-gradient(145deg, rgba(50, 50, 50, 0.7), rgba(30, 30, 30, 0.85));
            color: #f5f5f7; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .btn-aksi { 
            background: linear-gradient(145deg, rgba(170, 170, 175, 0.75), rgba(130, 130, 135, 0.85));
            color: #000000; 
            font-weight: 500;
            font-size: 1.7rem; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .btn-operator { 
            background: linear-gradient(145deg, rgba(255, 175, 40, 0.9), rgba(235, 130, 10, 0.95));
            color: #ffffff; 
            font-size: 2.3rem; 
            box-shadow: 0 8px 22px rgba(245, 130, 10, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .nol {
            grid-column: span 2;
            width: 100%;
            border-radius: 35px;
            justify-content: flex-start;
            padding-left: 26px;
            background: linear-gradient(145deg, rgba(50, 50, 50, 0.7), rgba(30, 30, 30, 0.85));
            color: #f5f5f7;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="kalkulator">
        <div class="layar-container">
            <div class="formula" id="formula"></div>
            <div class="layar" id="layar">0</div>
        </div>
        
        <div class="tombol-grid">
            <button class="btn-aksi" onclick="hapusLayar()">AC</button>
            <button class="btn-aksi" onclick="plusMinus()">+/-</button>
            <button class="btn-aksi" onclick="persen()">%</button>
            <button class="btn-operator" onclick="ketik('/')">÷</button>

            <button class="btn-angka" onclick="ketik('7')">7</button>
            <button class="btn-angka" onclick="ketik('8')">8</button>
            <button class="btn-angka" onclick="ketik('9')">9</button>
            <button class="btn-operator" onclick="ketik('*')">×</button>

            <button class="btn-angka" onclick="ketik('4')">4</button>
            <button class="btn-angka" onclick="ketik('5')">5</button>
            <button class="btn-angka" onclick="ketik('6')">6</button>
            <button class="btn-operator" onclick="ketik('-')">−</button>

            <button class="btn-angka" onclick="ketik('1')">1</button>
            <button class="btn-angka" onclick="ketik('2')">2</button>
            <button class="btn-angka" onclick="ketik('3')">3</button>
            <button class="btn-operator" onclick="ketik('+')">+</button>

            <button class="btn-angka nol" onclick="ketik('0')">0</button>
            <button class="btn-angka" onclick="ketik('.')">.</button>
            <button class="btn-operator" onclick="hitung()">=</button>
        </div>
    </div>

    <script>
        let layar = document.getElementById('layar');
        let formula = document.getElementById('formula');
        let nilaiSaatIni = '0';
        let statusHasil = false;
        const MAX_DIGIT = 10;

        function updateLayar() {
            let teksFormat = nilaiSaatIni.replace(/\*/g, '×').replace(/\//g, '÷');
            layar.innerText = teksFormat;

            let panjang = teksFormat.length;
            if (panjang > 8) {
                layar.style.fontSize = '2.6rem';
            } else if (panjang > 6) {
                layar.style.fontSize = '3.3rem';
            } else if (panjang > 4) {
                layar.style.fontSize = '3.8rem';
            } else {
                layar.style.fontSize = '4.2rem';
            }
        }

        function ketik(karakter) {
            if (statusHasil) {
                if ('+-*/'.includes(karakter)) {
                    statusHasil = false;
                } else {
                    nilaiSaatIni = '0';
                    statusHasil = false;
                }
            }

            if (nilaiSaatIni === '0' && karakter !== '.') { 
                nilaiSaatIni = ''; 
            }

            if (nilaiSaatIni.length >= MAX_DIGIT && !'+-*/'.includes(karakter)) {
                return; 
            }

            nilaiSaatIni += karakter;
            formula.innerText = nilaiSaatIni.replace(/\*/g, '×').replace(/\//g, '÷');
            updateLayar();
        }

        function hapusLayar() { 
            nilaiSaatIni = '0'; 
            formula.innerText = '';
            updateLayar(); 
        }

        function plusMinus() {
            if (nilaiSaatIni !== '0') {
                if (nilaiSaatIni.startsWith('-')) { 
                    nilaiSaatIni = nilaiSaatIni.substring(1); 
                } else { 
                    nilaiSaatIni = '-' + nilaiSaatIni; 
                }
                formula.innerText = nilaiSaatIni.replace(/\*/g, '×').replace(/\//g, '÷');
                updateLayar();
            }
        }

        function persen() {
            try { 
                let hasilEval = eval(nilaiSaatIni) / 100;
                formula.innerText = nilaiSaatIni.replace(/\*/g, '×').replace(/\//g, '÷') + ' %';
                nilaiSaatIni = hasilEval.toString(); 
                statusHasil = true;
                updateLayar(); 
            } catch { 
                layar.innerText = 'Error'; 
                nilaiSaatIni = '0'; 
            }
        }

        function hitung() {
            try { 
                let ekspresiRapi = nilaiSaatIni;
                formula.innerText = ekspresiRapi.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
                let hasilAkhir = eval(nilaiSaatIni).toString();
                
                if (hasilAkhir.length > MAX_DIGIT) {
                    hasilAkhir = Number(hasilAkhir).toPrecision(7);
                }

                nilaiSaatIni = hasilAkhir;
                statusHasil = true;
                updateLayar(); 
            } catch { 
                layar.innerText = 'Error'; 
                nilaiSaatIni = '0'; 
            }
        }
    </script>
</body>
</html>
