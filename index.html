<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Modern</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent; 
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a; 
      color: #fff;
    }

    .calculator {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      width: 320px;
      position: relative;
      overflow: hidden;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 5px;
    }

    .brand {
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
    }

    .history-btn {
      background: transparent;
      border: none;
      color: #10b981;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .history-btn:active {
      transform: scale(0.95);
    }

    .display {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      text-align: right;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
    }

    .history {
      font-size: 14px;
      color: #94a3b8;
      min-height: 20px;
      margin-bottom: 5px;
    }

    .result {
      font-size: 38px;
      font-weight: 600;
      word-wrap: break-word;
      color: #f8fafc;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #334155;
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover { background: #475569; }
    .btn:active { transform: scale(0.92); }

    .operator { background: #3b82f6; color: #fff; }
    .operator:hover { background: #2563eb; }

    .clear { background: #ef4444; color: #fff; }
    .clear:hover { background: #dc2626; }

    .equal { background: #10b981; color: #fff; }
    .equal:hover { background: #059669; }

    .zero { grid-column: span 2; }
    
    .history-panel {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .history-panel.show {
      top: 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }

    .history-header h3 {
      color: #fff;
      font-size: 18px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .history-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-right: 5px;
    }

    .history-content::-webkit-scrollbar { width: 5px; }
    .history-content::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

    .history-item {
      text-align: right;
    }

    .history-item-eq {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .history-item-res {
      font-size: 22px;
      color: #fff;
      font-weight: bold;
    }

    .clear-history-btn {
      margin-top: 15px;
      padding: 12px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-history-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="top-bar">
      <span class="brand">Standar</span>
      <button class="history-btn" onclick="toggleHistory()">🕒 Riwayat</button>
    </div>

    <div class="display">
      <div class="history" id="history"></div>
      <div class="result" id="result">0</div>
    </div>
    
    <div class="buttons">
      <button class="btn clear" onclick="clearDisplay()">C</button>
      <button class="btn operator" onclick="deleteLast()">DEL</button>
      <button class="btn operator" onclick="appendOperator('%')">%</button>
      <button class="btn operator" onclick="appendOperator('/')">÷</button>

      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn operator" onclick="appendOperator('*')">×</button>

      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn operator" onclick="appendOperator('-')">-</button>

      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn operator" onclick="appendOperator('+')">+</button>

      <button class="btn zero" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendNumber('.')">.</button>
      <button class="btn equal" onclick="calculate()">=</button>
    </div>

    <div class="history-panel" id="historyPanel">
      <div class="history-header">
        <h3>Riwayat Hitungan</h3>
        <button class="close-btn" onclick="toggleHistory()">Tutup</button>
      </div>
      <div class="history-content" id="historyContent">
      </div>
      <button class="clear-history-btn" onclick="clearHistoryLog()">Hapus Riwayat</button>
    </div>

  </div>
  
  <script>
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let savedHistory = [];

    const resultElement = document.getElementById('result');
    const historyElement = document.getElementById('history');
    const historyPanel = document.getElementById('historyPanel');
    const historyContent = document.getElementById('historyContent');

    function toggleHistory() {
      historyPanel.classList.toggle('show');
    }

    function getDisplayOperator(op) {
      if (op === '*') return '×';
      if (op === '/') return '÷';
      return op;
    }

    function updateDisplay() {
      resultElement.innerText = currentInput;
      if (operator != null) {
        historyElement.innerText = `${previousInput} ${getDisplayOperator(operator)}`;
      } else {
        historyElement.innerText = '';
      }
    }

    function appendNumber(number) {
      if (currentInput === '0' && number !== '.') {
        currentInput = number;
      } else {
        if (number === '.' && currentInput.includes('.')) return;
        currentInput += number;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (currentInput === '' && op !== '-') return;
      if (previousInput !== '') {
        calculate();
      }
      operator = op;
      previousInput = currentInput;
      currentInput = '0';
      updateDisplay();
    }

    function calculate() {
      let computation;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      
      if (isNaN(prev) || isNaN(current)) return;
      
      switch (operator) {
        case '+': computation = prev + current; break;
        case '-': computation = prev - current; break;
        case '*': computation = prev * current; break;
        case '/': computation = current === 0 ? "Error" : prev / current; break;
        case '%': computation = prev % current; break;
        default: return;
      }
      
      const resultStr = computation.toString();
      const historyEquation = `${prev} ${getDisplayOperator(operator)} ${current} =`;
      savedHistory.unshift({ eq: historyEquation, res: resultStr });
      renderHistory();

      currentInput = resultStr;
      operator = null;
      previousInput = '';
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      previousInput = '';
      operator = null;
      updateDisplay();
    }

    function deleteLast() {
      if (currentInput.length === 1 || currentInput === "Error") {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function renderHistory() {
      if (savedHistory.length === 0) {
        historyContent.innerHTML = '<p style="color: #64748b; text-align: center; margin-top: 30px;">Belum ada riwayat</p>';
        return;
      }
      
      historyContent.innerHTML = savedHistory.map(item => `
        <div class="history-item">
          <div class="history-item-eq">${item.eq}</div>
          <div class="history-item-res">${item.res}</div>
        </div>
      `).join('');
    }

    function clearHistoryLog() {
      savedHistory = [];
      renderHistory();
      toggleHistory(); 
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key;
      if (/[0-9\.]/.test(key)) {
        appendNumber(key);
      } else if (['+', '-', '*', '/'].includes(key)) {
        appendOperator(key);
      } else if (key === '%') {
        appendOperator('%');
      } else if (key === 'Enter' || key === '=') {
        event.preventDefault(); 
        calculate();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });

    renderHistory();
  </script>
</body>
</html>
